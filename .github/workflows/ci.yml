# Checks every pull request and every push to main: lint, types, unit tests,
# a production build, then the browser tests against the fixture UI and, for
# the kiosk, a seeded local database.
#
# Cloudflare Workers Builds deploys main on its own. To keep a red build off
# the live site, require the "check" and "e2e" jobs in the branch protection
# rule for main (GitHub → Settings → Branches). Whether to also require
# "audit" is a judgement call: it can fail for reasons outside this repo.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations apply cleanly and match the schema
        run: npm run db:check
      - name: Production build
        run: npm run build
        env:
          # Build-time only. Real values live in the Cloudflare dashboard.
          AUTH_SECRET: ci-build-only-not-a-real-secret
          DATABASE_URL: file:./ci-build.db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Local database for the kiosk tests
        # Local D1 only: this job has no Cloudflare credentials.
        run: npm run e2e:db
      - name: Browser tests
        run: npm run test:e2e
        env:
          # The kiosk tests must run here. Without this they skip when the
          # database is missing, and a broken setup would pass unnoticed.
          E2E_WORKSTATION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # On its own so an advisory, or the audit service being down, does not also
  # switch off the browser tests. It counts everything a production package
  # names, including optional peers that never ship in the Worker (nodemailer,
  # the Prisma CLI, Playwright, TypeScript, sharp), so it errs on the safe side.
  # Clear a failure by upgrading, or with an "overrides" entry in package.json,
  # not by silencing this job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No high-severity advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
