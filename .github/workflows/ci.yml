# Checks every pull request and every push to main: lint, types, unit tests,
# a production build, then the browser tests against the fixture UI.
#
# Cloudflare Workers Builds deploys main on its own. To keep a red build off
# the live site, require the "check" and "e2e" jobs in the branch protection
# rule for main (GitHub → Settings → Branches).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations apply cleanly and match the schema
        run: npm run db:check
      - name: Production build
        run: npm run build
        env:
          # Build-time only. Real values live in the Cloudflare dashboard.
          AUTH_SECRET: ci-build-only-not-a-real-secret
          DATABASE_URL: file:./ci-build.db
      - name: No high-severity advisories in production dependencies
        # Fails the build. npm also counts the Prisma CLI and nodemailer here,
        # because production packages list them as optional peers, although
        # neither is in the Worker bundle. Fix by upgrading or with an
        # "overrides" entry in package.json rather than by silencing this step.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
