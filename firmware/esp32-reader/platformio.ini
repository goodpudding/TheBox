; ESP32 badge reader for The Box
; Hardware: KeeYees ESP32-WROOM-32 + PN532 V3 (I2C) + Shelly Smart Plug
;
; Setup:
;   1. Install PlatformIO (VS Code extension or CLI)
;   2. Copy include/secrets.example.h → include/secrets.h and edit
;   3. pio run -t upload
;   4. pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PN532@^1.3.4
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
